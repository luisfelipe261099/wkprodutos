<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" fill="none" role="img" aria-label="Karla Wollinger Representações">
  <defs>
    <linearGradient id="kwGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c2f58"/>
      <stop offset="100%" stop-color="#1a5a9e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1fa6a1"/>
      <stop offset="100%" stop-color="#16837f"/>
    </linearGradient>
  </defs>

  <!-- Símbolo: losango com inicial KW -->
  <rect x="4" y="4" width="78" height="78" rx="14" fill="url(#kwGrad)"/>

  <!-- Barra decorativa teal no topo do símbolo -->
  <rect x="4" y="4" width="78" height="6" rx="6" fill="url(#accentGrad)"/>
  <rect x="4" y="8" width="78" height="2" fill="url(#accentGrad)"/>

  <!-- Letra K -->
  <text x="14" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="800" fill="white" letter-spacing="-2">K</text>

  <!-- Letra W em teal -->
  <text x="40" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="800" fill="#1fa6a1" letter-spacing="-2">W</text>

  <!-- Linha divisória vertical -->
  <rect x="100" y="12" width="2" height="64" rx="1" fill="#d6dde7"/>

  <!-- Nome principal -->
  <text x="116" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0c2f58" letter-spacing="0.5">KARLA WOLLINGER</text>

  <!-- Linha decorativa teal sob o nome -->
  <rect x="116" y="44" width="216" height="3" rx="1.5" fill="#1fa6a1"/>

  <!-- Subtítulo -->
  <text x="116" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#5d7086" letter-spacing="2.5">REPRESENTANTE COMERCIAL</text>
</svg>
