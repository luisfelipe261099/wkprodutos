<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8f4ff"/><stop offset="100%" stop-color="#d5f0ed"/></linearGradient>
    <linearGradient id="spray" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2f7cc8"/><stop offset="100%" stop-color="#1e5ea3"/></linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- Spray bottle -->
  <rect x="155" y="85" width="70" height="155" rx="8" fill="url(#spray)"/>
  <rect x="155" y="85" width="70" height="155" rx="8" fill="none" stroke="#155088" stroke-width="2"/>
  <!-- Trigger -->
  <rect x="175" y="60" width="25" height="30" rx="3" fill="#888"/>
  <path d="M225,75 L250,72 L252,80 L228,84 Z" fill="#999"/>
  <path d="M250,68 L265,55" stroke="#aaa" stroke-width="2" stroke-dasharray="3,3"/>
  <!-- Nozzle -->
  <rect x="183" y="50" width="10" height="15" rx="2" fill="#777"/>
  <!-- Label -->
  <rect x="162" y="120" width="56" height="60" rx="4" fill="#fff" opacity="0.95"/>
  <text x="190" y="142" text-anchor="middle" fill="#1e5ea3" font-family="Arial" font-weight="bold" font-size="9">DESINFETANTE</text>
  <text x="190" y="157" text-anchor="middle" fill="#e74c3c" font-family="Arial" font-weight="bold" font-size="8">HOSPITALAR</text>
  <text x="190" y="172" text-anchor="middle" fill="#5d7086" font-family="Arial" font-size="8">750ml</text>
  <!-- Shine -->
  <path d="M165,95 L163,200" stroke="rgba(255,255,255,0.2)" stroke-width="5" stroke-linecap="round"/>
  <!-- Discount badge -->
  <circle cx="310" cy="100" r="32" fill="#e74c3c"/>
  <text x="310" y="96" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="11">ATÉ</text>
  <text x="310" y="112" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="16">35%</text>
  <text x="200" y="268" text-anchor="middle" fill="#1e5ea3" font-family="Arial" font-weight="bold" font-size="13">DESINFETANTE</text>
</svg>