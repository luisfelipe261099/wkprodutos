<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8f4ff"/><stop offset="100%" stop-color="#d5f0ed"/></linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f1c40f"/><stop offset="100%" stop-color="#d4a90a"/></linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- Bleach bottle -->
  <rect x="152" y="60" width="96" height="170" rx="12" fill="url(#bottle)"/>
  <rect x="152" y="60" width="96" height="170" rx="12" fill="none" stroke="#b8960a" stroke-width="2"/>
  <!-- Cap -->
  <rect x="175" y="40" width="50" height="25" rx="6" fill="#e74c3c"/>
  <rect x="185" y="33" width="30" height="12" rx="6" fill="#c0392b"/>
  <!-- Handle -->
  <path d="M248,80 Q275,80 275,110 L275,130 Q275,145 260,145 L248,145" fill="none" stroke="#b8960a" stroke-width="6" stroke-linecap="round"/>
  <!-- Label -->
  <rect x="162" y="95" width="76" height="70" rx="4" fill="#fff" opacity="0.95"/>
  <text x="200" y="118" text-anchor="middle" fill="#e74c3c" font-family="Arial" font-weight="bold" font-size="12">ALVEJANTE</text>
  <text x="200" y="136" text-anchor="middle" fill="#5d7086" font-family="Arial" font-size="10">PROFISSIONAL</text>
  <text x="200" y="155" text-anchor="middle" fill="#5d7086" font-family="Arial" font-size="9">5 Litros</text>
  <!-- Shine -->
  <path d="M162,70 L160,190" stroke="rgba(255,255,255,0.25)" stroke-width="6" stroke-linecap="round"/>
  <!-- Discount badge -->
  <circle cx="320" cy="90" r="32" fill="#e74c3c"/>
  <text x="320" y="86" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="11">ATÉ</text>
  <text x="320" y="102" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="16">40%</text>
  <text x="200" y="260" text-anchor="middle" fill="#1e5ea3" font-family="Arial" font-weight="bold" font-size="13">ALVEJANTE LAVANDERIA</text>
</svg>