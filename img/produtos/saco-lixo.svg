<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8f4ff"/><stop offset="100%" stop-color="#d5f0ed"/></linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- Trash bag -->
  <path d="M130,230 L120,100 Q120,75 155,70 L245,70 Q280,75 280,100 L270,230 Z" fill="#2c3e50" opacity="0.85"/>
  <path d="M130,230 L120,100 Q120,75 155,70 L245,70 Q280,75 280,100 L270,230 Z" fill="none" stroke="#1a252f" stroke-width="2"/>
  <!-- Tie -->
  <path d="M160,70 L175,50 L200,55 L225,50 L240,70" fill="none" stroke="#1a252f" stroke-width="3" stroke-linecap="round"/>
  <!-- Shine -->
  <path d="M150,100 L145,180" stroke="rgba(255,255,255,0.2)" stroke-width="8" stroke-linecap="round"/>
  <!-- Label -->
  <rect x="155" y="130" width="90" height="50" rx="6" fill="#fff" opacity="0.9"/>
  <text x="200" y="152" text-anchor="middle" fill="#1e5ea3" font-family="Arial" font-weight="bold" font-size="12">100 LITROS</text>
  <text x="200" y="170" text-anchor="middle" fill="#5d7086" font-family="Arial" font-size="10">REFORÇADO</text>
  <!-- Discount badge -->
  <circle cx="320" cy="85" r="32" fill="#e74c3c"/>
  <text x="320" y="81" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="11">ATÉ</text>
  <text x="320" y="97" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="16">25%</text>
  <text x="200" y="262" text-anchor="middle" fill="#1e5ea3" font-family="Arial" font-weight="bold" font-size="13">SACO DE LIXO</text>
</svg>