<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8f4ff"/><stop offset="100%" stop-color="#d5f0ed"/></linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8e44ad"/><stop offset="100%" stop-color="#6c3483"/></linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- Aerosol can -->
  <ellipse cx="200" cy="235" rx="38" ry="8" fill="#d5c0e0"/>
  <rect x="162" y="70" width="76" height="165" rx="10" fill="url(#can)"/>
  <rect x="162" y="70" width="76" height="165" rx="10" fill="none" stroke="#5b2c80" stroke-width="2"/>
  <!-- Top -->
  <ellipse cx="200" cy="70" rx="38" ry="8" fill="#9b59b6"/>
  <rect x="190" y="45" width="20" height="30" rx="4" fill="#ccc"/>
  <rect x="193" y="38" width="14" height="12" rx="7" fill="#aaa"/>
  <!-- Spray particles -->
  <circle cx="230" cy="38" r="2" fill="#ddd" opacity="0.6"/>
  <circle cx="240" cy="32" r="1.5" fill="#ddd" opacity="0.4"/>
  <circle cx="225" cy="28" r="1.8" fill="#ddd" opacity="0.5"/>
  <circle cx="237" cy="42" r="1.2" fill="#ddd" opacity="0.3"/>
  <!-- Label -->
  <rect x="170" y="110" width="60" height="70" rx="4" fill="#fff" opacity="0.95"/>
  <text x="200" y="133" text-anchor="middle" fill="#8e44ad" font-family="Arial" font-weight="bold" font-size="10">ODORIZADOR</text>
  <text x="200" y="148" text-anchor="middle" fill="#5d7086" font-family="Arial" font-size="9">AEROSSOL</text>
  <text x="200" y="170" text-anchor="middle" fill="#5d7086" font-family="Arial" font-size="8">400ml</text>
  <!-- Shine -->
  <path d="M172,80 L170,190" stroke="rgba(255,255,255,0.2)" stroke-width="5" stroke-linecap="round"/>
  <!-- Discount badge -->
  <circle cx="310" cy="90" r="32" fill="#e74c3c"/>
  <text x="310" y="86" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="11">ATÉ</text>
  <text x="310" y="102" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="16">30%</text>
</svg>