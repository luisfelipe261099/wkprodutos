<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8f4ff"/><stop offset="100%" stop-color="#d5f0ed"/></linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- Napkin pack -->
  <rect x="100" y="100" width="200" height="120" rx="10" fill="#fff" stroke="#d4c4a8" stroke-width="2"/>
  <!-- Top fold -->
  <path d="M100,120 Q200,85 300,120" fill="#faf5ee" stroke="#d4c4a8" stroke-width="1.5"/>
  <!-- Label area -->
  <rect x="130" y="130" width="140" height="60" rx="6" fill="#1e5ea3" opacity="0.1"/>
  <text x="200" y="155" text-anchor="middle" fill="#1e5ea3" font-family="Arial" font-weight="bold" font-size="14">GUARDANAPO</text>
  <text x="200" y="175" text-anchor="middle" fill="#1e5ea3" font-family="Arial" font-weight="bold" font-size="11">PREMIUM</text>
  <!-- Napkins peeking -->
  <rect x="140" y="93" width="120" height="12" rx="3" fill="#fef9f0" stroke="#e8dcc8" stroke-width="1"/>
  <line x1="155" y1="99" x2="265" y2="99" stroke="#e8dcc8" stroke-width="0.5"/>
  <!-- Stack indicator -->
  <text x="200" y="210" text-anchor="middle" fill="#5d7086" font-family="Arial" font-size="10">Pacote 500un</text>
  <!-- Discount badge -->
  <circle cx="330" cy="100" r="32" fill="#e74c3c"/>
  <text x="330" y="96" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="11">ATÉ</text>
  <text x="330" y="112" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="16">30%</text>
</svg>