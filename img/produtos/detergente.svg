  <text x="180" y="135" text-anchor="middle" fill="#1e5ea3" font-family="Arial" font-weight="bold" font-size="13">DETERGENTE</text>
  <text x="180" y="155" text-anchor="middle" fill="#1e5ea3" font-family="Arial" font-weight="bold" font-size="10">PROFISSIONAL</text>
  <line x1="145" y1="165" x2="215" y2="165" stroke="#1fa6a1" stroke-width="2"/>
  <text x="180" y="182" text-anchor="middle" fill="#5d7086" font-family="Arial" font-size="9">5 LITROS</text>
  <!-- Shine -->
