<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8f4ff"/><stop offset="100%" stop-color="#d5f0ed"/></linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1fa6a1"/><stop offset="100%" stop-color="#157a77"/></linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- Bottle -->
  <rect x="162" y="40" width="36" height="25" rx="4" fill="#ddd"/>
  <rect x="170" y="30" width="20" height="15" rx="3" fill="#bbb"/>
  <path d="M155,65 L160,65 L162,50 L198,50 L200,65 L245,65 L250,240 L110,240 L115,65 Z" fill="url(#bottle)"/>
  <path d="M155,65 L160,65 L162,50 L198,50 L200,65 L245,65 L250,240 L110,240 L115,65 Z" fill="none" stroke="#127572" stroke-width="2"/>
  <!-- Label -->
